name: CI

on:
  pull_request:
  push:
    branches: [main, rc]

permissions:
  contents: read

# A newer commit on a pull request cancels the run for the older one. Pushes are never cancelled and never share a
# group: each push to rc selects the CUDA compile from its own pushed range, so a cancelled or superseded run would
# lose that range's selection.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: check (fmt, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release publication decisions
        run: bash scripts/test_publish_release.sh
      # rust-toolchain.toml pins the toolchain and its components; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      # A missing lockfile is resolved here so fmt and clippy still report, and the job fails at its last step.
      - name: Cargo.lock is committed
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
            echo "LOCK_MISSING=1" >> "$GITHUB_ENV"
            echo "::error::Cargo.lock is not committed; the resolved lockfile follows"
            cat Cargo.lock
          fi
      - run: cargo fmt --all --check
      - name: cargo clippy (runs even when fmt fails, so one run reports both)
        if: success() || failure()
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Every crate linked into the shipped binaries has its licence notice (a planted missing one is red)
        run: |
          set -u
          python3 scripts/third_party_notices.py --check
          grep -v '^serde_json ' licenses/rust-crates.txt > planted-notices.txt
          if python3 scripts/third_party_notices.py --check planted-notices.txt 2> planted-notices.err; then
            cat planted-notices.err
            echo "::error::the notice check passed with serde_json's notice removed"
            exit 1
          fi
          cat planted-notices.err
          grep -F "no notice for linked crate serde_json" planted-notices.err
          rm planted-notices.txt planted-notices.err
      - name: Fail if Cargo.lock was missing
        if: always()
        run: test -z "${LOCK_MISSING:-}"

  build-test:
    name: build-test (${{ matrix.os }}, CPU)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build --workspace --locked
      - name: Test (the pipeline cases print their summary)
        run: cargo test --workspace --locked -- --nocapture
      - run: cargo run --locked -p ggtts-cli --bin ggtts-render -- --version

  ggml:
    needs: specialized-selection
    if: needs.specialized-selection.outputs.ggml == 'true'
    name: ggml (ubuntu-latest, CPU, ggml built from the submodule)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Fetch the ggml submodule at its pin
        run: |
          set -eu
          git submodule update --init crates/ggtts-ggml-sys/ggml
          pin=$(sed -n 's/^pub const GGML_COMMIT: &str = "\([0-9a-f]\{40\}\)";$/\1/p' crates/ggtts-ggml-sys/src/lib.rs)
          test "$(git -C crates/ggtts-ggml-sys/ggml rev-parse HEAD)" = "$pin"
          echo "ggml submodule at $pin"
      - name: The shipped ggml licence is the submodule's, and every linked crate has its notice
        run: python3 scripts/third_party_notices.py --check
      - name: cargo clippy with the engines (ggml built by cargo with CMake)
        run: cargo clippy --workspace --all-targets --features ggtts-cli/ggml --locked -- -D warnings
      - name: cargo clippy with the test-only plant feature (the planted defects and their expected-failure tests), and the binding with its engines and JNI layer
        run: cargo clippy --workspace --all-targets --features ggtts-cli/ggml,ggtts-qwen3-tts/plant,ggtts-ffi/ggml,ggtts-ffi/jni,ggtts-ffi/plant --locked -- -D warnings
      - name: Test with the engines (the identity checks need model files and stay opt-in, so they report ignored)
        run: cargo test --workspace --features ggtts-cli/ggml --locked -- --nocapture
      - name: ggml links and computes (one ggml_add through the bindings)
        run: cargo test --locked -p ggtts-ggml-sys --features ggml tests::links_and_runs_one_op -- --exact
      - name: ggtts-render refuses a file that is not a model
        run: |
          set -u
          cargo build --locked -p ggtts-cli --features ggml
          printf 'not a model' > not-a-model.gguf
          if target/debug/ggtts-render --model not-a-model.gguf --out x.flac --text hi 2> err.txt; then
            echo "::error::ggtts-render accepted a file that is not a GGUF"
            exit 1
          fi
          cat err.txt
          grep -F 'not a GGUF file' err.txt
      - name: ggtts-render lists both engines (what the release's BUILDINFO is read from)
        run: bash scripts/buildinfo_engines.sh target/debug/ggtts-render qwen3-tts kitten-tts-2

  ggml-windows:
    needs: specialized-selection
    if: needs.specialized-selection.outputs.ggml == 'true'
    # A probe, not a gate: it records whether the engines build and link on Windows (MSVC), and what breaks if not.
    # Its build steps may fail without failing the job; the job summary says which.
    name: ggml-windows (probe; reports, does not gate)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      # bindgen: the committed bindings are for x86_64 Linux only, so Windows generates its own.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # Plain text, so the report can grep the build log.
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: git submodule update --init crates/ggtts-ggml-sys/ggml
      - name: Build ggtts-render with the engines
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          cargo build --locked -p ggtts-cli -p ggtts-ggml-sys --features ggtts-cli/ggml,ggtts-ggml-sys/bindgen 2>&1 | tee build.log
      - name: ggml links and computes
        id: link
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: cargo test --locked -p ggtts-ggml-sys --features bindgen tests::links_and_runs_one_op -- --exact
      - name: Report
        if: always()
        run: |
          {
            echo "### ggml on Windows (probe)"
            echo "- build ggtts-render --features ggml: ${{ steps.build.outcome }}"
            echo "- link test: ${{ steps.link.outcome }}"
            if [ "${{ steps.build.outcome }}" != success ] && [ -f build.log ]; then
              echo '```'
              grep -E '^(error|warning: unused)|error[:\[]|LNK[0-9]+|undefined|unresolved|panicked' build.log | head -n 40 || true
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  planted-ceiling:
    name: planted ceiling (44 must turn the pipeline cases red)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Plant a story ceiling of 44 in the Qwen3-TTS profile
        run: |
          set -eu
          f=crates/ggtts-qwen3-tts/src/lib.rs
          grep -q '^    story_ceiling: 45,$' "$f"
          sed -i 's/^    story_ceiling: 45,$/    story_ceiling: 44,/' "$f"
          grep -n '^    story_ceiling:' "$f"
      - name: The pipeline cases must fail, and name what failed
        run: |
          set -u
          if cargo test --locked -p ggtts-core --test pipeline_cases pipeline_cases -- --exact --nocapture > out.txt 2>&1; then
            cat out.txt
            echo "::error::the pipeline cases passed with the story ceiling at 44"
            exit 1
          fi
          cat out.txt
          grep -E 'pipeline cases: [0-9]+ passed, [1-9][0-9]* failed' out.txt
          grep -F 'FAILED chunks/ceiling-exact/story' out.txt
          grep -F 'FAILED render/arm-join-every-mark' out.txt
          echo "red as required: the planted ceiling is seen"

  cuda-compile:
    needs: specialized-selection
    # Never on an ordinary pull request. The selector sets `cuda` only for a pull request into main (the promotion)
    # and for a push to rc that touches something the CUDA build depends on (cuda_push_path in the selector).
    # Everything from runs-on to the build command is release.yml's cuda-build, line for line: the selection job
    # refuses any difference (select_specialized_ci.py --check-cuda-drift).
    if: needs.specialized-selection.outputs.cuda == 'true'
    name: cuda-compile (the release CUDA archive, sm_86 and sm_89, built and smoked without a GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu22.04@sha256:d49bb8a4ff97fb5fe477947a3f02aa8c0a53eae77e11f00ec28618a0bcaa2ad1
    steps:
      - name: Install build tools
        run: |
          # The Ubuntu archive fails now and then (apt-get exit 100): three attempts, with a pause between.
          attempt=1
          until apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git cmake g++ make python3; do
            if [ "$attempt" -ge 3 ]; then echo "apt-get failed $attempt times"; exit 1; fi
            attempt=$((attempt + 1))
            sleep 20
          done
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the pinned ggml
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/crates/ggtts-ggml-sys/ggml"
          git submodule update --init crates/ggtts-ggml-sys/ggml
          pin=$(sed -n 's/^pub const GGML_COMMIT: &str = "\([0-9a-f]\{40\}\)";$/\1/p' crates/ggtts-ggml-sys/src/lib.rs)
          test "$(git -C crates/ggtts-ggml-sys/ggml rev-parse HEAD)" = "$pin"
      - name: Build and smoke CUDA archive
        env:
          TAG: ci
        run: bash scripts/package_cuda_release.sh

  specialized-selection:
    name: Select release and binding checks (a skip is not a pass)
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.select.outputs.package }}
      binding: ${{ steps.select.outputs.binding }}
      android: ${{ steps.select.outputs.android }}
      release: ${{ steps.select.outputs.release }}
      ggml: ${{ steps.select.outputs.ggml }}
      cuda: ${{ steps.select.outputs.cuda }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test specialized selection
        run: python3 scripts/test_select_specialized_ci.py
      - name: cuda-compile is release.yml's cuda-build, line for line
        run: python3 scripts/select_specialized_ci.py --check-cuda-drift
      - name: Test the glibc floor check (a planted Ubuntu 24.04 binary is refused, and nothing read is never a pass)
        run: python3 scripts/test_check_glibc_floor.py
      - name: Test the release version check (a wrong tag or commit, an unknown commit and a missing binary are refused)
        run: python3 scripts/test_check_release_version.py
      - name: Select checks
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # For the CUDA compile on a push to rc: the ref and the pushed range.
          REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: python3 scripts/select_specialized_ci.py >> "$GITHUB_OUTPUT"

  package-smoke:
    needs: specialized-selection
    if: needs.specialized-selection.outputs.package == 'true'
    name: package-smoke (${{ matrix.os }}; script instruments and the C library run from a packed release directory, and planted missing pieces are red)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ""
            archive: tar.gz
          - os: windows-latest
            exe: ".exe"
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      # The fake engine needs no ggml, so this builds without it; release.yml packs its ggml build with the same script.
      - run: cargo build --release --locked -p ggtts-cli -p ggtts-ffi
        env:
          GGTTS_RELEASE_VERSION: v0.1.0-rc.999
      - name: The PE import check reads real and built images (a DLL the archive lacks is red, shipped beside it green)
        env:
          GGTTS_PE_SAMPLE: ${{ runner.os == 'Windows' && 'target/release/ggtts_ffi.dll' || '' }}
        run: python3 scripts/test_check_pe_imports.py -v
      - name: Pack, as release.yml does (it must list both binaries, and the C library)
        env:
          LIBS: ${{ runner.os == 'Windows' && '["lib/ggtts_ffi.dll","lib/ggtts_ffi.dll.lib"]' || '["lib/libggtts_ffi.so"]' }}
        run: |
          set -eu
          list=$(scripts/package_and_smoke.sh pack "target/release/ggtts-render${{ matrix.exe }}" dist/ggtts-ci)
          echo "binaries: $list"
          test "$list" = '["ggtts-render${{ matrix.exe }}","ggtts-measure${{ matrix.exe }}"]'
          libs=$(scripts/package_and_smoke.sh libraries dist/ggtts-ci)
          echo "libraries: $libs"
          test "$libs" = "$LIBS"
          cmp crates/ggtts-ffi/include/ggtts.h dist/ggtts-ci/include/ggtts.h
          # Match the release's metadata, so the archive smoke reaches the same check. GITHUB_SHA is also what the
          # build embedded for --version (crates/ggtts-core/build.rs).
          printf '{"ggtts": "v0.1.0-rc.999", "ggtts_commit": "%s", "binaries": %s, "libraries": %s}\n' "$GITHUB_SHA" \
            "$list" "$libs" > dist/ggtts-ci/BUILDINFO.json
      - name: Smoke the packed directory (a shipped Python instrument runs from it; a C program builds and renders against lib/ and include/)
        run: |
          set -eu
          scripts/package_and_smoke.sh smoke dist/ggtts-ci 2> smoke.err || { cat smoke.err; exit 1; }
          cat smoke.err
          grep -F "ffi smoke: ok: ABI version" smoke.err
          grep -F "a C program built against include/ggtts.h and lib/ loaded and rendered on the fake engine" smoke.err
      - name: Archive it as release.yml does (a .zip on windows) and smoke the archive by its relative path
        run: |
          set -eu
          (cd dist && ../scripts/package_and_smoke.sh archive ggtts-ci ${{ matrix.archive }})
          scripts/package_and_smoke.sh smoke dist/ggtts-ci.${{ matrix.archive }} v0.1.0-rc.999
      - name: Planted, wrong release metadata or either binary must fail the version check
        run: |
          set -eu
          cp -r dist/ggtts-ci dist/version-bad-info
          printf '{"ggtts": "v0.1.0-rc.998"}\n' > dist/version-bad-info/BUILDINFO.json
          if python3 scripts/check_release_version.py dist/version-bad-info v0.1.0-rc.999 2> version.err; then
            echo '::error::wrong BUILDINFO version passed'; exit 1
          fi
          grep -F 'BUILDINFO ggtts' version.err
          # A BUILDINFO whose ggtts_commit is not the commit the binaries were built from.
          cp -r dist/ggtts-ci dist/version-bad-commit
          printf '{"ggtts": "v0.1.0-rc.999", "ggtts_commit": "%s"}\n' 0000000000000000000000000000000000000000 \
            > dist/version-bad-commit/BUILDINFO.json
          if python3 scripts/check_release_version.py dist/version-bad-commit v0.1.0-rc.999 2> version.err; then
            echo '::error::a wrong BUILDINFO ggtts_commit passed'; exit 1
          fi
          grep -F 'reports ggtts commit' version.err
          # Build the same cheap fake-engine binaries with a different embedded tag.
          GGTTS_RELEASE_VERSION=v0.1.0-rc.998 cargo build --release --locked -p ggtts-cli
          for binary in ggtts-render ggtts-measure; do
            cp -r dist/ggtts-ci "dist/version-bad-$binary"
            cp "target/release/$binary${{ matrix.exe }}" "dist/version-bad-$binary/$binary${{ matrix.exe }}"
            if python3 scripts/check_release_version.py "dist/version-bad-$binary" v0.1.0-rc.999 2> version.err; then
              echo "::error::wrong $binary version passed"; exit 1
            fi
            grep -F "$binary" version.err
          done
      - name: Planted, an archive with an incorrect BUILDINFO binary must fail
        run: |
          set -eu
          for missing in render measure; do
            cp -r dist/ggtts-ci "dist/info-$missing"
            if [ "$missing" = render ]; then
              printf '{"binaries": ["ggtts-renderXexe","ggtts-measure${{ matrix.exe }}"]}\n' > "dist/info-$missing/BUILDINFO.json"
            else
              printf '{"binaries": ["ggtts-render${{ matrix.exe }}","ggtts-measureXexe"]}\n' > "dist/info-$missing/BUILDINFO.json"
            fi
            (cd dist && ../scripts/package_and_smoke.sh archive "info-$missing" ${{ matrix.archive }})
            if scripts/package_and_smoke.sh smoke "dist/info-$missing.${{ matrix.archive }}" 2> info.err; then
              echo "::error::incorrect BUILDINFO passed for ggtts-$missing"
              exit 1
            fi
            cat info.err
            grep -F "BUILDINFO.json's binaries does not name ggtts-$missing" info.err
          done
      - name: Planted, a missing archive must fail, naming it
        run: |
          set -u
          if scripts/package_and_smoke.sh smoke dist/absent.${{ matrix.archive }} 2> absent.err; then
            cat absent.err
            echo "::error::the smoke passed on a missing archive"
            exit 1
          fi
          cat absent.err
          grep -F "no such archive: dist/absent.${{ matrix.archive }}" absent.err
      - name: Planted, the same directory without instruments/ must fail, naming the missing directory
        run: |
          set -u
          cp -r dist/ggtts-ci dist/planted
          rm -rf dist/planted/instruments
          if scripts/package_and_smoke.sh smoke dist/planted 2> planted.err; then
            cat planted.err
            echo "::error::the smoke passed without instruments/"
            exit 1
          fi
          cat planted.err
          grep -F "instruments/ directory was not found" planted.err
      - name: Planted, the same directory without ggtts-measure must fail, naming it
        run: |
          set -u
          cp -r dist/ggtts-ci dist/planted-measure
          rm -f dist/planted-measure/ggtts-measure${{ matrix.exe }}
          if scripts/package_and_smoke.sh smoke dist/planted-measure 2> planted-measure.err; then
            cat planted-measure.err
            echo "::error::the smoke passed without ggtts-measure"
            exit 1
          fi
          cat planted-measure.err
          grep -F "no ggtts-measure in" planted-measure.err
      - name: Planted, the same directory without a licence notice must fail, naming it
        run: |
          set -u
          for notice in THIRD_PARTY.md README-kitten.md licenses/Apache-2.0.txt licenses/ggml-LICENSE.txt licenses/rust-crates.txt \
              licenses/chatterbox-LICENSE.txt licenses/pyannote-audio-LICENSE.txt licenses/asteroid-filterbanks-LICENSE.txt \
              instruments/vendor/fft.js-4.0.4/LICENSE instruments/vendor/pitchy-4.1.0/LICENSE; do
            rm -rf dist/planted-notice
            cp -r dist/ggtts-ci dist/planted-notice
            rm "dist/planted-notice/$notice"
            if scripts/package_and_smoke.sh smoke dist/planted-notice 2> planted-notice.err; then
              cat planted-notice.err
              echo "::error::the smoke passed without $notice"
              exit 1
            fi
            cat planted-notice.err
            grep -F "missing licence notice in dist/planted-notice: $notice" planted-notice.err
          done
      - name: Planted, the same directory without the header or a library file must fail, naming it
        env:
          LIBFILES: ${{ runner.os == 'Windows' && 'lib/ggtts_ffi.dll lib/ggtts_ffi.dll.lib' || 'lib/libggtts_ffi.so' }}
        run: |
          set -u
          for f in include/ggtts.h $LIBFILES; do
            rm -rf dist/planted-ffi
            cp -r dist/ggtts-ci dist/planted-ffi
            rm "dist/planted-ffi/$f"
            if scripts/package_and_smoke.sh smoke dist/planted-ffi 2> planted-ffi.err; then
              cat planted-ffi.err
              echo "::error::the smoke passed without $f"
              exit 1
            fi
            cat planted-ffi.err
            grep -F "no $f in dist/planted-ffi" planted-ffi.err
          done
      - name: Planted, a header whose GGTTS_ABI_VERSION is not the library's must fail, naming both
        run: |
          set -u
          rm -rf dist/planted-abi
          cp -r dist/ggtts-ci dist/planted-abi
          sed -i 's/^#define GGTTS_ABI_VERSION \([0-9][0-9]*\)/#define GGTTS_ABI_VERSION 9\1/' dist/planted-abi/include/ggtts.h
          grep -E '^#define GGTTS_ABI_VERSION 9[0-9]+' dist/planted-abi/include/ggtts.h
          if scripts/package_and_smoke.sh smoke dist/planted-abi 2> planted-abi.err; then
            cat planted-abi.err
            echo "::error::the smoke passed with a header of another ABI version"
            exit 1
          fi
          cat planted-abi.err
          grep -E "ffi smoke: FAILED: the library's ggtts_abi_version\(\) is [0-9]+, the header's GGTTS_ABI_VERSION is 9[0-9]+" planted-abi.err
      - name: Planted, a packed DLL needing a DLL that neither Windows nor the archive has must fail, naming it
        if: runner.os == 'Windows'
        run: |
          set -u
          if python3 scripts/check_pe_imports.py --deny vcruntime140.dll --packed dist/ggtts-ci 2> pe.err; then
            cat pe.err
            echo "::error::the PE import check passed with VCRUNTIME140.dll treated as missing"
            exit 1
          fi
          cat pe.err
          grep -E "ggtts_ffi.dll: needs VCRUNTIME140.dll, which is neither" pe.err
          # The no-op: a file of that name beside each importer (the root and lib/) passes the same check.
          rm -rf dist/planted-pe
          cp -r dist/ggtts-ci dist/planted-pe
          cp dist/planted-pe/lib/ggtts_ffi.dll dist/planted-pe/VCRUNTIME140.dll
          cp dist/planted-pe/lib/ggtts_ffi.dll dist/planted-pe/lib/VCRUNTIME140.dll
          python3 scripts/check_pe_imports.py --deny vcruntime140.dll --packed dist/planted-pe

  binding:
    needs: specialized-selection
    if: needs.specialized-selection.outputs.binding == 'true'
    name: binding (the C-ABI with the planted panic, and the Kotlin binding on the host JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: The C-ABI on the host, with the planted panic caught at the boundary
        run: cargo test --locked -p ggtts-ffi --features plant -- --nocapture
      - name: The Kotlin binding on the host JVM (the runner's JDK and kotlinc)
        run: scripts/kotlin_binding_test.sh

  android-arm64:
    needs: specialized-selection
    if: needs.specialized-selection.outputs.android == 'true'
    name: android-arm64 (cargo-ndk, ggml at the pin, NEON confirmed, with both checks planted)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-linux-android
      - name: cargo-ndk, pinned
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: The NDK, pinned
        run: |
          set -eu
          ndk="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
      - name: Fetch the ggml submodule at its pin
        run: git submodule update --init crates/ggtts-ggml-sys/ggml
      - name: Build for aarch64-linux-android; check the ggml pin and NEON in the kernels
        run: scripts/android_build.sh build dist/android-arm64
      - name: Planted, a wrong ggml pin is refused
        run: |
          if scripts/android_build.sh check-pin 0000000000000000000000000000000000000000; then
            echo "::error::a wrong ggml pin was accepted"
            exit 1
          fi
      - name: Planted, ggml built without NEON is refused
        run: |
          set -eu
          GGML_CPU_ARM_ARCH=armv8-a+nosimd scripts/android_build.sh cargo-build "$PWD/target-nosimd"
          if scripts/android_build.sh check-neon target-nosimd/aarch64-linux-android/release/ggtts-render; then
            echo "::error::a build without NEON passed the NEON check"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-arm64
          path: dist/android-arm64
          if-no-files-found: error

  release-build:
    needs: specialized-selection
    if: needs.specialized-selection.outputs.release == 'true'
    # Selected PRs and the rc-to-main promotion use the release matrix; the first step refuses drift.
    name: release-build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The release's glibc floor is its build host's: Ubuntu 22.04, as in release.yml.
          - os: ubuntu-22.04
            target: x86_64-linux
            features: ggtts-cli/ggml,ggtts-ffi/ggml
          - os: windows-latest
            target: x86_64-windows
            features: ggtts-cli/bindgen,ggtts-ffi/ggml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release matrix carries the same runner, target and features
        env:
          OS: ${{ matrix.os }}
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          # The line after "target: <this target>" in release.yml that sets features, read without a YAML parser.
          got=$(awk -v t="target: ${TARGET}" '$0 ~ t {f=1} f && /^ *features:/ {sub(/^ *features: */, ""); print; exit}' \
            .github/workflows/release.yml)
          echo "release.yml features for ${TARGET}: ${got:-<none>}"
          test "$got" = "$FEATURES"
          # The "- os:" line that opens this target's matrix entry: the runner decides the glibc the binary needs.
          os=$(awk -v t="${TARGET}" '$1 == "-" && $2 == "os:" {o=$3} $1 == "target:" && $2 == t {print o; exit}' \
            .github/workflows/release.yml)
          echo "release.yml runner for ${TARGET}: ${os:-<none>}"
          test "$os" = "$OS"
          # The build command, whole: release.yml's `run: cargo build --release` line and this job's own, so a package
          # dropped from either (a shipped binary not built) goes red.
          release_cmd() { grep -m1 -E '^ +run: cargo build --release' "$1" | sed 's/^ *run: //'; }
          ours=$(awk '/name: Build ggtts-render and the Kitten tools exactly as release.yml does/ {f=1}
            f && /^ *run: / {sub(/^ *run: */, ""); print; exit}' .github/workflows/ci.yml)
          echo "release.yml build: $(release_cmd .github/workflows/release.yml)"
          echo "this job's build:  ${ours:-<none>}"
          test -n "$ours"
          test "$(release_cmd .github/workflows/release.yml)" = "$ours"
          # Planted: release.yml without -p ggtts-kitten, or without -p ggtts-ffi (the C library), must not match.
          for crate in ggtts-kitten ggtts-ffi; do
            sed "s/ -p $crate / /" .github/workflows/release.yml > "$RUNNER_TEMP/release-drift.yml"
            if [ "$(release_cmd "$RUNNER_TEMP/release-drift.yml")" = "$ours" ]; then
              echo "::error::the drift check passed a release.yml that no longer builds $crate"
              exit 1
            fi
          done
      - run: rustup show active-toolchain || rustup toolchain install
      - run: git submodule update --init crates/ggtts-ggml-sys/ggml
      - name: Build ggtts-render and the Kitten tools exactly as release.yml does
        env:
          LIBCLANG_PATH: ${{ runner.os == 'Windows' && 'C:\Program Files\LLVM\bin' || '' }}
          GGML_PORTABLE: "1"
        run: cargo build --release --locked -p ggtts-cli -p ggtts-kitten -p ggtts-ffi --features "${{ matrix.features }}"
      - name: Verify the CPU build does not target the build host
        run: |
          set -euo pipefail
          cache=$(find target/release/build -path '*/ggtts-ggml-sys-*/out/build/CMakeCache.txt' -print -quit)
          test -n "$cache" && test -f "$cache"
          grep -qx 'GGML_NATIVE:BOOL=OFF' "$cache"
          grep -qx 'GGML_AVX512:BOOL=OFF' "$cache"
          grep -qx 'GGML_AVX512_VBMI:BOOL=OFF' "$cache"
          grep -qx 'GGML_AVX512_VNNI:BOOL=OFF' "$cache"
          grep -qx 'GGML_AVX512_BF16:BOOL=OFF' "$cache"
          grep -qx 'GGML_AVX_VNNI:BOOL=OFF' "$cache"
      - name: Pack and smoke as release.yml does (the Kitten tools run --help from it, a C program renders on its library; a planted missing tool is red)
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          set -euo pipefail
          list=$(scripts/package_and_smoke.sh pack "target/release/ggtts-render$EXE" dist/release-ci)
          echo "binaries: $list"
          test "$list" = "[\"ggtts-render$EXE\",\"ggtts-measure$EXE\",\"ggtts-kitten-convert$EXE\",\"ggtts-kitten$EXE\"]"
          libs=$(scripts/package_and_smoke.sh libraries dist/release-ci)
          echo "libraries: $libs"
          tag=$("dist/release-ci/ggtts-render$EXE" --version | sed -n '1s/^ggtts-render //p')
          printf '{"ggtts": "%s", "ggtts_commit": "%s", "binaries": %s, "libraries": %s}\n' "$tag" "$GITHUB_SHA" \
            "$list" "$libs" > dist/release-ci/BUILDINFO.json
          scripts/package_and_smoke.sh smoke dist/release-ci "$tag"
          for b in ggtts-kitten-convert ggtts-kitten; do
            rm -rf dist/planted-kitten
            cp -r dist/release-ci dist/planted-kitten
            rm "dist/planted-kitten/$b$EXE"
            if scripts/package_and_smoke.sh smoke dist/planted-kitten 2> planted-kitten.err; then
              cat planted-kitten.err
              echo "::error::the smoke passed without $b"
              exit 1
            fi
            cat planted-kitten.err
            grep -F "no $b$EXE in dist/planted-kitten" planted-kitten.err
          done
      - name: The Linux binaries and the C library need no newer glibc, libstdc++, libgcc_s or libgomp than Ubuntu 22.04 ships
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Every binary and library pack put in the directory, from its BUILDINFO "binaries" and "libraries", never a
          # list kept here.
          python3 scripts/check_glibc_floor.py --packed dist/release-ci 2> floor.err || { cat floor.err; exit 1; }
          cat floor.err
          grep -F "lib/libggtts_ffi.so: highest needed:" floor.err
          # Planted: a packed ELF that the list leaves out is refused, naming it.
          rm -rf dist/planted-glibc
          cp -r dist/release-ci dist/planted-glibc
          cp target/release/ggtts-render dist/planted-glibc/ggtts-unlisted
          if python3 scripts/check_glibc_floor.py --packed dist/planted-glibc 2> planted-glibc.err; then
            cat planted-glibc.err
            echo "::error::the glibc floor check passed a packed binary BUILDINFO does not list"
            exit 1
          fi
          cat planted-glibc.err
          grep -F "ggtts-unlisted is an ELF file that BUILDINFO.json's binaries and libraries leave out" planted-glibc.err
          # Planted: the C library left out of "libraries" is refused the same way.
          rm -rf dist/planted-glibc
          cp -r dist/release-ci dist/planted-glibc
          sed -i 's/, "libraries": \[[^]]*\]//' dist/planted-glibc/BUILDINFO.json
          if python3 scripts/check_glibc_floor.py --packed dist/planted-glibc 2> planted-glibc.err; then
            cat planted-glibc.err
            echo "::error::the glibc floor check passed a packed library BUILDINFO does not list"
            exit 1
          fi
          cat planted-glibc.err
          grep -F "lib/libggtts_ffi.so is an ELF file that BUILDINFO.json's binaries and libraries leave out" planted-glibc.err
      - name: Planted, the same binary against a floor below what it needs must fail, naming the version
        if: runner.os == 'Linux'
        run: |
          set -u
          if python3 scripts/check_glibc_floor.py --floor GLIBC=2.17 --floor GLIBCXX=3.4.19 \
              target/release/ggtts-render 2> planted-floor.err; then
            cat planted-floor.err
            echo "::error::the glibc floor check passed a binary above a planted floor of glibc 2.17"
            exit 1
          fi
          cat planted-floor.err
          grep -E 'ggtts-render: GLIBC_2\.[0-9.]+ from libc\.so\.6 exceeds the floor GLIBC_2\.17' planted-floor.err
          grep -E 'GLIBCXX_3\.4\.[0-9]+ from libstdc\+\+\.so\.6 exceeds the floor GLIBCXX_3\.4\.19' planted-floor.err
