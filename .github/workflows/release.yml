name: Release

# Four stages: build (one job per kind of archive), smoke (one job per kind, on the artifact the build uploaded,
# before anything is published), attest and publish, and verify-published (the published assets against the sha256
# each build recorded, and their attestations). A new kind of archive adds a build job or matrix entry that uploads
# dist-<target> and sums-<target>, and a smoke job or matrix entry for it; publish needs both.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35, GCC 12 runtime) is the oldest system the Linux CPU archive runs on: a binary
          # needs the glibc and libstdc++ it was linked against or newer. ubuntu-latest (24.04) made v0.1.0-rc.7
          # and rc.8 need glibc 2.39. scripts/check_glibc_floor.py below refuses any binary above that floor.
          - os: ubuntu-22.04
            target: x86_64-linux
            exe: ""
            archive: tar.gz
            # The C library (ggtts-ffi) with the same engines, packed into lib/ beside include/ggtts.h.
            features: ggtts-cli/ggml,ggtts-ffi/ggml
          - os: windows-latest
            target: x86_64-windows
            exe: ".exe"
            archive: zip
            # the committed bindings are for x86_64 Linux only, so Windows generates its own
            features: ggtts-cli/bindgen,ggtts-ffi/ggml
    runs-on: ${{ matrix.os }}
    # CI's release-build job runs this matrix's build command on every PR; keep the two matrices the same.
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Fetch the ggml submodule at its pin
        run: |
          set -eu
          git submodule update --init crates/ggtts-ggml-sys/ggml
          pin=$(sed -n 's/^pub const GGML_COMMIT: &str = "\([0-9a-f]\{40\}\)";$/\1/p' crates/ggtts-ggml-sys/src/lib.rs)
          test "$(git -C crates/ggtts-ggml-sys/ggml rev-parse HEAD)" = "$pin"
      - name: Test before building the release
        run: cargo test --workspace --locked
      - name: Build ggtts-render with both engines (Qwen3-TTS, Kitten-TTS 2) on ggml, the Kitten tools, and the C library
        env:
          LIBCLANG_PATH: ${{ runner.os == 'Windows' && 'C:\Program Files\LLVM\bin' || '' }}
          GGTTS_RELEASE_VERSION: ${{ github.ref_name }}
          # Do not bake the build host instruction set into shipped CPU binaries.
          GGML_PORTABLE: "1"
        run: cargo build --release --locked -p ggtts-cli -p ggtts-kitten -p ggtts-ffi --features "${{ matrix.features }}"
      - name: Package, named with the ggml pin
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          src=crates/ggtts-core/src/lib.rs
          commit=$(sed -n 's/^ *pub const COMMIT: &str = "\([0-9a-f]\{40\}\)";$/\1/p' "$src")
          describe=$(sed -n 's/^ *pub const DESCRIBE: &str = "\(.*\)";$/\1/p' "$src")
          test ${#commit} -eq 40
          name="ggtts-${TAG}-${TARGET}-cpu-ggml-${commit:0:7}"
          mkdir -p "dist/$name"
          # The binary, LICENSE, README, the script instruments (instruments/ beside the binary) and the C library
          # (lib/, include/ggtts.h), packed by the same script ci.yml smoke-tests on every pull request.
          binaries=$(scripts/package_and_smoke.sh pack "target/release/ggtts-render${EXE}" "dist/$name")
          libraries=$(scripts/package_and_smoke.sh libraries "dist/$name")
          # The engines are read from what the binary says it carries; the script refuses an empty or short list.
          engines=$(bash scripts/buildinfo_engines.sh "dist/$name/ggtts-render${EXE}" qwen3-tts kitten-tts-2)
          cat > "dist/$name/BUILDINFO.json" <<EOF
          {
            "ggtts": "${TAG}",
            "ggtts_commit": "${GITHUB_SHA}",
            "ggml_commit": "${commit}",
            "ggml_describe": "${describe}",
            "rustc": "$(rustc -V)",
            "target": "${TARGET}",
            "binaries": ${binaries},
            "libraries": ${libraries},
            "library_features": ["cpu", "ggml"],
            "features": ["cpu", "ggml"],
            "engines": ${engines},
            "built_by": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF
          # The Linux binaries and the C library need no newer glibc, libstdc++, libgcc_s or libgomp than Ubuntu 22.04
          # ships. The check reads them from BUILDINFO's "binaries" and "libraries" (pack's own lists) and refuses a
          # packed ELF missing from both.
          if [ "$RUNNER_OS" = Linux ]; then python3 scripts/check_glibc_floor.py --packed "dist/$name"; fi
          "dist/$name/ggtts-render${EXE}" --version | tee "dist/$name/VERSION.txt"
          grep -q "$commit" "dist/$name/VERSION.txt"
          cd dist
          ../scripts/package_and_smoke.sh archive "$name" "$ARCHIVE"
          rm -rf "$name"
          ls -l
      - name: Record the archive's sha256, which the smoke and the published check hold it to
        run: |
          set -euo pipefail
          mkdir -p sums
          for a in dist/*.tar.gz dist/*.zip; do
            [ -e "$a" ] || continue
            scripts/release_smoke.sh sum "$a" | tee "sums/$(basename "$a").sha256"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.target }}
          path: sums/*
          if-no-files-found: error

  cuda-build:
    name: build (x86_64-linux-cuda)
    # CI's cuda-compile job is this job from runs-on to the build command, line for line, and runs on the promotion
    # pull request; CI refuses any difference (scripts/select_specialized_ci.py --check-cuda-drift).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu22.04@sha256:d49bb8a4ff97fb5fe477947a3f02aa8c0a53eae77e11f00ec28618a0bcaa2ad1
    steps:
      - name: Install build tools
        run: |
          # The Ubuntu archive fails now and then (apt-get exit 100): three attempts, with a pause between.
          attempt=1
          until apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git cmake g++ make python3; do
            if [ "$attempt" -ge 3 ]; then echo "apt-get failed $attempt times"; exit 1; fi
            attempt=$((attempt + 1))
            sleep 20
          done
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the pinned ggml
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/crates/ggtts-ggml-sys/ggml"
          git submodule update --init crates/ggtts-ggml-sys/ggml
          pin=$(sed -n 's/^pub const GGML_COMMIT: &str = "\([0-9a-f]\{40\}\)";$/\1/p' crates/ggtts-ggml-sys/src/lib.rs)
          test "$(git -C crates/ggtts-ggml-sys/ggml rev-parse HEAD)" = "$pin"
      - name: Build and smoke CUDA archive
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/package_cuda_release.sh
      - name: Record the archive's sha256, which the smoke and the published check hold it to
        run: |
          set -eu
          mkdir -p sums
          for a in dist/*.tar.gz; do bash scripts/release_smoke.sh sum "$a" | tee "sums/$(basename "$a").sha256"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-x86_64-linux-cuda
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-x86_64-linux-cuda
          path: sums/*
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.target }}, before publishing)
    # The archive as its build uploaded it, smoked the way a user meets it (scripts/release_smoke.sh archive): the
    # sha256 its build recorded, the package smoke (instruments, ggtts-measure, the C program against lib/ and
    # include/ggtts.h, the Kitten tools, --version against the tag and BUILDINFO), the tag's commit in --version, one
    # real Qwen3-TTS line on the CPU with --speaker hk_voice_343 and the default pinned model, and an unknown speaker
    # refused. ci.yml's package-smoke and release-build run the same script on every pull request that selects them.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 is the oldest system the Linux CPU archive supports. --container also runs --version and the
          # render inside a bare ubuntu:22.04 with nothing added but libgomp1 (the README's instruction for a minimal
          # system), so a runtime library the runner image happens to carry cannot hide a missing one.
          - os: ubuntu-22.04
            target: x86_64-linux
            smoke: --render --container ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
          - os: windows-latest
            target: x86_64-windows
            smoke: --render
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      GGTTS_CACHE_DIR: ${{ github.workspace }}/ggtts-model-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sums-${{ matrix.target }}
          path: sums
      - name: The default model's cache key, from its pinned sha256s in crates/ggtts-models
        id: model
        run: echo "key=$(scripts/release_smoke.sh model-key)" >> "$GITHUB_OUTPUT"
      # The default model (2.3 GB), as ggtts-render downloads and verifies it; the cache only spares the download.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ggtts-model-cache
          key: ${{ steps.model.outputs.key }}
          enableCrossOsArchive: true
      - name: Smoke the archive before it is published
        env:
          TAG: ${{ github.ref_name }}
          SMOKE: ${{ matrix.smoke }}
        run: |
          set -euo pipefail
          n=0
          for a in dist/*.tar.gz dist/*.zip; do
            [ -e "$a" ] || continue
            # SMOKE is a list of options, split on purpose.
            scripts/release_smoke.sh archive "$a" sums "$TAG" "$GITHUB_SHA" $SMOKE
            n=$((n + 1))
          done
          test "$n" -eq 1

  smoke-cuda:
    name: smoke (x86_64-linux-cuda, before publishing)
    # The CUDA archive as its build uploaded it, on a runner without a GPU: the sha256 its build recorded, the package
    # smoke (the fake engine, the C program against the archive's CPU library, the Kitten tools, --version against the
    # tag and BUILDINFO) and the tag's commit in --version. ggtts-render links the CUDA driver, so it starts here on
    # the toolkit's stub driver, as cuda-build's own smoke does; the image is cuda-build's. A real GPU render is the
    # promotion gate's. ci.yml's cuda-compile runs the same command on the archive it builds.
    needs: cuda-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu22.04@sha256:d49bb8a4ff97fb5fe477947a3f02aa8c0a53eae77e11f00ec28618a0bcaa2ad1
    steps:
      - name: Install what the smoke needs (python3 for the instruments, a C compiler for the library smoke)
        run: |
          attempt=1
          until apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates gcc libc6-dev python3; do
            if [ "$attempt" -ge 3 ]; then echo "apt-get failed $attempt times"; exit 1; fi
            attempt=$((attempt + 1))
            sleep 20
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-linux-cuda
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sums-x86_64-linux-cuda
          path: sums
      - name: Smoke the archive before it is published
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          for a in dist/*.tar.gz; do bash scripts/release_smoke.sh archive "$a" sums "$TAG" "$GITHUB_SHA" --cuda-stub; done

  publish:
    name: attest and publish
    # Nothing is attested or published until every archive has passed its smoke.
    needs: [build, cuda-build, smoke, smoke-cuda]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/publish_release.sh dist/*

  verify-published:
    name: verify the published release
    # What a user downloads: every published asset's sha256 is the one its build recorded and the one GitHub reports,
    # no smoked archive is missing from the release, and gh attestation verify accepts each as built by this workflow
    # at this tag. Read access is enough; ci.yml's release-build runs the same check, with contents: read, on the
    # latest published release.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sums-*
          path: sums
          merge-multiple: true
      - name: Download the published assets; verify their sha256 and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/release_smoke.sh published "$TAG" "$GITHUB_REPOSITORY" sums
