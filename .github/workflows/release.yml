name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            exe: ""
            archive: tar.gz
            features: ggtts-cli/ggml
          - os: windows-latest
            target: x86_64-windows
            exe: ".exe"
            archive: zip
            # the committed bindings are for x86_64 Linux only, so Windows generates its own
            features: ggtts-cli/bindgen
    runs-on: ${{ matrix.os }}
    # CI's release-build job runs this matrix's build command on every PR; keep the two matrices the same.
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Fetch the ggml submodule at its pin
        run: |
          set -eu
          git submodule update --init crates/ggtts-ggml-sys/ggml
          pin=$(sed -n 's/^pub const GGML_COMMIT: &str = "\([0-9a-f]\{40\}\)";$/\1/p' crates/ggtts-ggml-sys/src/lib.rs)
          test "$(git -C crates/ggtts-ggml-sys/ggml rev-parse HEAD)" = "$pin"
      - name: Test before building the release
        run: cargo test --workspace --locked
      - name: Build ggtts-render with both engines (Qwen3-TTS, Kitten-TTS 2) on ggml
        env:
          LIBCLANG_PATH: ${{ runner.os == 'Windows' && 'C:\Program Files\LLVM\bin' || '' }}
          GGTTS_RELEASE_VERSION: ${{ github.ref_name }}
        run: cargo build --release --locked -p ggtts-cli --features "${{ matrix.features }}"
      - name: Package, named with the ggml pin
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          src=crates/ggtts-core/src/lib.rs
          commit=$(sed -n 's/^ *pub const COMMIT: &str = "\([0-9a-f]\{40\}\)";$/\1/p' "$src")
          describe=$(sed -n 's/^ *pub const DESCRIBE: &str = "\(.*\)";$/\1/p' "$src")
          test ${#commit} -eq 40
          name="ggtts-${TAG}-${TARGET}-cpu-ggml-${commit:0:7}"
          mkdir -p "dist/$name"
          # The binary, LICENSE, README and the script instruments (instruments/ beside the binary), packed by the
          # same script ci.yml smoke-tests on every pull request.
          binaries=$(scripts/package_and_smoke.sh pack "target/release/ggtts-render${EXE}" "dist/$name")
          # The engines are read from what the binary says it carries; the script refuses an empty or short list.
          engines=$(bash scripts/buildinfo_engines.sh "dist/$name/ggtts-render${EXE}" qwen3-tts kitten-tts-2)
          cat > "dist/$name/BUILDINFO.json" <<EOF
          {
            "ggtts": "${TAG}",
            "ggtts_commit": "${GITHUB_SHA}",
            "ggml_commit": "${commit}",
            "ggml_describe": "${describe}",
            "rustc": "$(rustc -V)",
            "target": "${TARGET}",
            "binaries": ${binaries},
            "features": ["cpu", "ggml"],
            "engines": ${engines},
            "built_by": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF
          "dist/$name/ggtts-render${EXE}" --version | tee "dist/$name/VERSION.txt"
          grep -q "$commit" "dist/$name/VERSION.txt"
          cd dist
          ../scripts/package_and_smoke.sh archive "$name" "$ARCHIVE"
          rm -rf "$name"
          ls -l
      - name: Smoke the archive (a shipped Python instrument runs from it; a planted missing instruments/ is reported)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for a in dist/*.tar.gz dist/*.zip; do
            [ -e "$a" ] || continue
            scripts/package_and_smoke.sh smoke "$a" "$TAG"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  cuda-build:
    name: build (x86_64-linux-cuda)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu22.04@sha256:d49bb8a4ff97fb5fe477947a3f02aa8c0a53eae77e11f00ec28618a0bcaa2ad1
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git cmake g++ make python3
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the pinned ggml
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/crates/ggtts-ggml-sys/ggml"
          git submodule update --init crates/ggtts-ggml-sys/ggml
          pin=$(sed -n 's/^pub const GGML_COMMIT: &str = "\([0-9a-f]\{40\}\)";$/\1/p' crates/ggtts-ggml-sys/src/lib.rs)
          test "$(git -C crates/ggtts-ggml-sys/ggml rev-parse HEAD)" = "$pin"
      - name: Build and smoke CUDA archive
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/package_cuda_release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-x86_64-linux-cuda
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: attest and publish
    needs: [build, cuda-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/publish_release.sh dist/*
