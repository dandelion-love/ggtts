[package]
name = "ggtts-cli"
description = "The ggtts command-line tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ggtts-render"
path = "src/bin/ggtts-render.rs"

[[bin]]
name = "ggtts-measure"
path = "src/bin/ggtts-measure.rs"

[dependencies]
ggtts-core.workspace = true
ggtts-instruments.workspace = true
ggtts-qwen3-tts.workspace = true
ggtts-kitten = { path = "../ggtts-kitten" }
ggtts-fake.workspace = true
ggtts-models.workspace = true
# Not called by ggtts-render yet; linked so the ggml builds of this crate (CI's ggml job) compile the
# shared loader's engine code too.
ggtts-load.workspace = true
serde_json.workspace = true

[dev-dependencies]
claxon.workspace = true
# The conformance test (`tests/conformance.rs`) drives these front ends too: the book's options parser and the C ABI.
ggtts-book = { path = "../ggtts-book" }
ggtts-ffi = { path = "../ggtts-ffi" }
jsonschema = { version = "0.60.2", default-features = false }

[features]
default = []
# The engines over ggml. Off by default, so the workspace builds without the ggml submodule; ggtts-render then
# only reports its version.
ggml = ["ggtts-qwen3-tts/ggml", "ggtts-kitten/ggml", "ggtts-load/ggml"]
# The CUDA backend as well, for --device cuda.
cuda = ["ggml", "ggtts-qwen3-tts/cuda", "ggtts-kitten/cuda", "ggtts-load/cuda"]
# The engines over ggml with bindings generated at build time, for targets with no committed bindings (everything but
# x86_64 Linux, so the Windows release). Needs libclang. A feature of ggtts-cli, because `cargo build -p ggtts-cli`
# cannot name a feature of a package it does not select.
bindgen = ["ggml", "ggtts-qwen3-tts/bindgen"]
