[package]
name = "ggtts-kitten"
description = "The ggtts Kitten-TTS 2 engine: a ternary (BitNet-style) Qwen3 speech LM on ggml, its converter and its parity checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ggtts-kitten-convert"
path = "src/bin/ggtts-kitten-convert.rs"

[[bin]]
name = "ggtts-kitten"
path = "src/bin/ggtts-kitten.rs"
required-features = ["ggml"]

[features]
default = []
# The ggml graph (the model, the session, the parity check and rendering). Off by default, like ggtts-ggml-sys's
# own feature, so the default workspace build needs neither the ggml submodule nor a C toolchain.
ggml = ["dep:ggtts-ggml-sys", "ggtts-ggml-sys/ggml"]
# The same, with ggml built (or linked from GGML_LIB_DIR) with CUDA, for `--device cuda`.
cuda = ["ggml", "ggtts-ggml-sys/cuda"]

[dependencies]
ggtts-core.workspace = true
ggtts-ggml-sys = { path = "../ggtts-ggml-sys", optional = true }
serde_json.workspace = true
claxon.workspace = true

