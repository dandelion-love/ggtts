<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src data:; connect-src 'none'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>Listening feedback</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 60rem; margin: auto; padding: 1rem; line-height: 1.5; }
    h1 { font-size: 1.5rem; }
    .item { border: 1px solid; border-radius: .5rem; margin: 1rem 0; padding: 1rem; }
    .passage { font-size: 1.35rem; line-height: 2.5; overflow-wrap: anywhere; }
    .character { font: inherit; padding: .12rem .16rem; border: 1px solid transparent; border-radius: .25rem; background: transparent; color: inherit; cursor: pointer; }
    .character[aria-pressed="true"] { background: #ffe28a; color: #171300; text-decoration: underline wavy #a22500; }
    .character:focus-visible, button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid #3d83ff; outline-offset: 2px; }
    label { display: block; margin: .7rem 0 .2rem; }
    textarea { box-sizing: border-box; width: 100%; min-height: 4rem; font: inherit; }
    button, select, input { font: inherit; }
    button { min-height: 2.5rem; }
    audio { display: block; max-width: 100%; margin: .5rem 0; }
    #message { min-height: 1.5em; }
    .error { color: #b71919; font-weight: bold; }
    @media (prefers-color-scheme: dark) { .error { color: #ffac9e; } }
  </style>
</head>
<body>
  <main>
    <h1>Listening feedback</h1>
    <p>Play each clip. Select any CJK character that sounds wrong; select it again to remove the mark. Ratings do not change marks.</p>
    <p id="message" role="status" aria-live="polite"></p>
    <div id="items"></div>
    <label for="read-note">Note about the whole read</label>
    <textarea id="read-note"></textarea>
    <p>
      <button type="button" id="export">Export feedback</button>
      <label for="import-file">Restore feedback from a JSON file</label>
      <input id="import-file" type="file" accept="application/json,.json">
    </p>
  </main>
  <!-- GGTTS_INPUT -->
  <script>
  'use strict';
  (() => {
    const inputNode = document.getElementById('feedback-input');
    const message = document.getElementById('message');
    const container = document.getElementById('items');
    const note = document.getElementById('read-note');
    const exportButton = document.getElementById('export');
    const importFile = document.getElementById('import-file');
    let input, state, storageKey, inputDigest;

    function notify(text, error = false) {
      message.textContent = text;
      message.className = error ? 'error' : '';
    }
    function cjk(cp) {
      return (cp >= 0x3400 && cp <= 0x4dbf) ||
        (cp >= 0x4e00 && cp <= 0x9fff) ||
        (cp >= 0xf900 && cp <= 0xfaff) ||
        (cp >= 0x20000 && cp <= 0x2fa1f) ||
        (cp >= 0x30000 && cp <= 0x323af);
    }
    function countCjk(text) {
      return Array.from(text).filter(ch => cjk(ch.codePointAt(0))).length;
    }
    function validAudio(value) {
      if (typeof value !== 'string' || !/^data:audio\/flac;base64,[A-Za-z0-9+/]+={0,2}$/.test(value)) return false;
      try {
        const bytes = atob(value.slice(value.indexOf(',') + 1));
        return bytes.length >= 42 && bytes.startsWith('fLaC') &&
          (bytes.charCodeAt(4) & 0x7f) === 0 && bytes.charCodeAt(5) === 0 &&
          bytes.charCodeAt(6) === 0 && bytes.charCodeAt(7) === 34 &&
          ((bytes.charCodeAt(18) << 12) | (bytes.charCodeAt(19) << 4) | (bytes.charCodeAt(20) >> 4)) > 0 &&
          ((bytes.charCodeAt(21) & 15) | bytes.charCodeAt(22) | bytes.charCodeAt(23) | bytes.charCodeAt(24) | bytes.charCodeAt(25)) !== 0;
      } catch (_) { return false; }
    }
    const validId = id => typeof id === 'string' && /^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$/.test(id);
    const exact = (obj, keys) => obj && typeof obj === 'object' && !Array.isArray(obj) &&
      Object.keys(obj).length === keys.length && keys.every(key => Object.prototype.hasOwnProperty.call(obj, key));
    const scalarText = text => typeof text === 'string' && text.length > 0 &&
      Array.from(text).every(ch => { const cp = ch.codePointAt(0); return cp < 0xd800 || cp > 0xdfff; });
    function validateInput(obj) {
      if (!exact(obj, ['format', 'id', 'items']) ||
          obj.format !== 'ggtts-feedback-input/1' || !validId(obj.id) ||
          !Array.isArray(obj.items) || !obj.items.length) throw new Error('Invalid feedback input.');
      const ids = new Set();
      for (const item of obj.items) {
        if (!exact(item, ['id', 'text', 'audio']) || !validId(item.id) || ids.has(item.id) ||
            !scalarText(item.text) || !validAudio(item.audio)) throw new Error('Invalid feedback item.');
        ids.add(item.id);
      }
    }
    function initial() {
      return { format: 'ggtts-feedback-result/1', id: input.id, input_sha256: inputDigest, note: '',
        items: input.items.map(item => ({ id: item.id, marks: [], rating: 'unsure', note: '' })) };
    }
    function validateResult(result) {
      if (!exact(result, ['format', 'id', 'input_sha256', 'note', 'items']) ||
          result.format !== 'ggtts-feedback-result/1' || result.id !== input.id || result.input_sha256 !== inputDigest ||
          typeof result.note !== 'string' ||
          !Array.isArray(result.items) || result.items.length !== input.items.length)
        throw new Error('Invalid feedback result.');
      const ids = new Set();
      for (const item of result.items) {
        const original = input.items.find(source => item && source.id === item.id);
        if (!exact(item, ['id', 'marks', 'rating', 'note']) || !original || ids.has(item.id) || typeof item.note !== 'string' ||
            !['accept', 'reject', 'unsure'].includes(item.rating) || !Array.isArray(item.marks))
          throw new Error('Invalid feedback item result.');
        const marks = new Set();
        for (const index of item.marks) {
          if (!Number.isSafeInteger(index) || index < 0 || index >= countCjk(original.text) || marks.has(index))
            throw new Error('Invalid character index in feedback.');
          marks.add(index);
        }
        ids.add(item.id);
      }
    }
    // SHA-256 over the exact generator-embedded ASCII JSON, independent of
    // WebCrypto so file: and offline WebView contexts can verify their input.
    function sha256(text) {
      const bytes = [];
      for (let i = 0; i < text.length; i++) {
        const c = text.charCodeAt(i);
        if (c > 127) throw new Error('Feedback input is not canonical ASCII JSON.');
        bytes.push(c);
      }
      const bitLength = bytes.length * 8;
      bytes.push(0x80);
      while (bytes.length % 64 !== 56) bytes.push(0);
      const high = Math.floor(bitLength / 0x100000000);
      const low = bitLength >>> 0;
      for (let j = 3; j >= 0; j--) bytes.push((high >>> (j * 8)) & 255);
      for (let j = 3; j >= 0; j--) bytes.push((low >>> (j * 8)) & 255);
      const k = [
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
      ];
      const h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
      const rotr = (x, n) => (x >>> n) | (x << (32 - n));
      for (let offset = 0; offset < bytes.length; offset += 64) {
        const w = new Array(64);
        for (let i = 0; i < 16; i++) {
          const j = offset + i * 4;
          w[i] = ((bytes[j] << 24) | (bytes[j + 1] << 16) | (bytes[j + 2] << 8) | bytes[j + 3]) >>> 0;
        }
        for (let i = 16; i < 64; i++) {
          const x = w[i - 15], y = w[i - 2];
          const s0 = rotr(x, 7) ^ rotr(x, 18) ^ (x >>> 3);
          const s1 = rotr(y, 17) ^ rotr(y, 19) ^ (y >>> 10);
          w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
        }
        let [a,b,c,d,e,f,g,z] = h;
        for (let i = 0; i < 64; i++) {
          const s1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
          const ch = (e & f) ^ (~e & g);
          const t1 = (z + s1 + ch + k[i] + w[i]) >>> 0;
          const s0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const t2 = (s0 + maj) >>> 0;
          z = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
        }
        const values = [a,b,c,d,e,f,g,z];
        for (let i = 0; i < 8; i++) h[i] = (h[i] + values[i]) >>> 0;
      }
      return h.map(n => n.toString(16).padStart(8, '0')).join('');
    }
    function persist() {
      try {
        localStorage.setItem(storageKey, JSON.stringify({ input_sha256: inputDigest, result: state }));
        notify('Draft saved on this device.');
      } catch (_) { notify('Draft could not be saved on this device. Export your feedback.', true); }
    }
    function render() {
      container.textContent = "";
      note.value = state.note;
      for (const original of input.items) {
        const result = state.items.find(item => item.id === original.id);
        const section = document.createElement('section');
        section.className = 'item';
        const title = document.createElement('h2');
        title.textContent = 'Clip ' + (input.items.indexOf(original) + 1);
        section.append(title);
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.preload = 'none';
        audio.src = original.audio;
        audio.setAttribute('aria-label', 'Play ' + title.textContent);
        audio.addEventListener('error', () => notify('Audio could not be played.', true));
        section.append(audio);
        const passage = document.createElement('div');
        passage.className = 'passage';
        passage.setAttribute('aria-label', 'Text: select a CJK character to toggle its mark');
        let index = 0;
        for (const ch of Array.from(original.text)) {
          if (!cjk(ch.codePointAt(0))) { passage.append(document.createTextNode(ch)); continue; }
          const position = index++;
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'character';
          button.textContent = ch;
          const update = () => {
            const marked = result.marks.includes(position);
            button.setAttribute('aria-pressed', String(marked));
            button.setAttribute('aria-label', ch + ', character ' + (position + 1) + (marked ? ', marked' : ', not marked'));
          };
          update();
          button.addEventListener('click', () => {
            const at = result.marks.indexOf(position);
            if (at < 0) result.marks.push(position); else result.marks.splice(at, 1);
            result.marks.sort((a, b) => a - b);
            update(); count.textContent = result.marks.length + ' marked';
            persist();
          });
          passage.append(button);
        }
        section.append(passage);
        const count = document.createElement('p');
        count.textContent = result.marks.length + ' marked';
        count.setAttribute('aria-live', 'polite');
        section.append(count);
        const clear = document.createElement('button');
        clear.type = 'button'; clear.textContent = 'Clear marks';
        clear.addEventListener('click', () => { result.marks = []; persist(); render(); });
        section.append(clear);
        const ratingLabel = document.createElement('label');
        ratingLabel.textContent = 'Rating';
        const rating = document.createElement('select');
        rating.setAttribute('aria-label', 'Rating for ' + title.textContent);
        for (const value of ['unsure', 'accept', 'reject']) {
          const option = document.createElement('option'); option.value = value; option.textContent = value;
          rating.append(option);
        }
        rating.value = result.rating;
        rating.addEventListener('change', () => { result.rating = rating.value; persist(); });
        ratingLabel.append(rating); section.append(ratingLabel);
        const itemLabel = document.createElement('label');
        itemLabel.textContent = 'Note for ' + title.textContent;
        const itemNote = document.createElement('textarea');
        itemNote.value = result.note;
        itemNote.addEventListener('input', () => { result.note = itemNote.value; persist(); });
        itemLabel.append(itemNote); section.append(itemLabel);
        container.append(section);
      }
    }
    note.addEventListener('input', () => { state.note = note.value; persist(); });
    exportButton.addEventListener('click', () => {
      try {
        validateResult(state);
        const blob = new Blob([JSON.stringify(state, null, 2) + '\n'], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = 'feedback.json'; link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        notify('Feedback exported.');
      } catch (e) { notify(e.message || 'Could not export feedback.', true); }
    });
    importFile.addEventListener('change', async () => {
      try {
        const file = importFile.files[0];
        if (!file) return;
        const result = JSON.parse(await file.text());
        validateResult(result);
        state = result;
        persist(); render();
      } catch (e) { notify(e.message || 'Could not read feedback.', true); }
      finally { importFile.value = ''; }
    });
    try {
      if (!inputNode) throw new Error('Feedback input is missing.');
      const digestNode = document.querySelector('meta[name="feedback-input-sha256"]');
      if (!digestNode || !/^[0-9a-f]{64}$/.test(digestNode.content))
        throw new Error('Feedback input identity is missing.');
      inputDigest = sha256(inputNode.textContent);
      if (inputDigest !== digestNode.content) throw new Error('Feedback input identity mismatch.');
      input = JSON.parse(inputNode.textContent);
      validateInput(input);
      storageKey = 'ggtts-feedback-v1:' + inputDigest;
      state = initial();
      try {
        const raw = localStorage.getItem(storageKey);
        if (raw) {
          const saved = JSON.parse(raw);
          if (saved.input_sha256 !== inputDigest) throw new Error('Draft does not match this read.');
          validateResult(saved.result); state = saved.result;
          notify('Draft restored from this device.');
        }
      } catch (e) { notify('Draft could not be restored: ' + e.message, true); }
      render();
    } catch (e) {
      notify(e.message || 'Invalid feedback input.', true);
      exportButton.disabled = true; importFile.disabled = true; note.disabled = true;
    }
  })();
  </script>
</body>
</html>
